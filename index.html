<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moving Sale</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f7f4f0;
      color: #1c1c1c;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #fff;
      padding: 28px 20px 22px;
      text-align: center;
      border-bottom: 1px solid #ede9e3;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 6px;
      color: #777;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .header-cta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
      background: #c8522b;
      color: #fff;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .header-cta:hover { background: #ae4422; }
    .header-cta svg { flex-shrink: 0; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 20px 14px 40px;
      max-width: 960px;
      margin: 0 auto;
    }
    @media (min-width: 560px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 820px)  { .grid { grid-template-columns: repeat(4, 1fr); } }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover  { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .card:active { transform: scale(0.97); }

    .card-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #f0ece8;
    }

    .card-info { padding: 9px 11px 12px; }

    .card-name {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-price {
      margin-top: 5px;
      font-size: 1rem;
      font-weight: 700;
      color: #c8522b;
    }

    .multi-badge {
      display: inline-block;
      margin-top: 4px;
      background: #f0ece8;
      color: #888;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* ── Status ── */
    #status {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 0.9rem;
    }

    /* ── Overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.80);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }

    @media (min-width: 560px) {
      .overlay { align-items: center; padding: 16px; }
    }

    /* ── Modal ── */
    .modal {
      background: #fff;
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 560px) { .modal { border-radius: 20px; } }

    /* drag handle on mobile */
    .modal-handle {
      width: 36px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }
    @media (min-width: 560px) { .modal-handle { display: none; } }

    .modal-scroll {
      overflow-y: auto;
      flex: 1;
      /* smooth scrolling on iOS */
      -webkit-overflow-scrolling: touch;
    }

    /* ── Modal image area ── */
    .img-section {
      position: relative;
      background: #111;
      aspect-ratio: 4 / 3;
      flex-shrink: 0;
    }
    .img-section img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.16);
      border: none;
      color: #fff;
      font-size: 1.9rem;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .arrow:hover { background: rgba(255,255,255,0.30); }
    .arrow.left  { left: 10px; }
    .arrow.right { right: 10px; }

    .counter {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.50);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.42);
      border: none;
      color: #fff;
      font-size: 1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Modal body ── */
    .modal-body { padding: 18px 20px 28px; }

    .modal-name {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .modal-price {
      font-size: 1.6rem;
      font-weight: 800;
      color: #c8522b;
      margin-top: 6px;
    }

    .modal-detail {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #555;
      line-height: 1.7;
      white-space: pre-line;
    }

    .sms-btn {
      display: block;
      margin-top: 20px;
      background: #c8522b;
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .sms-btn:hover { background: #ae4422; }
  </style>
</head>
<body>

<header>
  <h1>Moving Sale 🏠</h1>
  <p>All items priced to go — great condition, local pickup.<br>Tap any item to see details and more photos.</p>
  <a class="header-cta" href="sms:4243650050">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012.18 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.15A16 16 0 0015.06 16.3l1.51-1.51a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
    </svg>
    Text me: 424-365-0050
  </a>
</header>

<p id="status">Loading items…</p>
<div id="grid" class="grid"></div>

<!-- Lightbox -->
<div id="overlay" class="overlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-scroll">
      <div class="img-section" id="img-section">
        <img id="modal-img" src="" alt="">
        <button class="arrow left"  id="arrow-left"  onclick="navigate(-1)">&#8249;</button>
        <button class="arrow right" id="arrow-right" onclick="navigate(1)">&#8250;</button>
        <span class="counter" id="counter"></span>
        <button class="close-btn" onclick="closeModal()">&#x2715;</button>
      </div>
      <div class="modal-body">
        <div id="modal-name"   class="modal-name"></div>
        <div id="modal-price"  class="modal-price"></div>
        <div id="modal-detail" class="modal-detail"></div>
        <a class="sms-btn" href="sms:4243650050">Text me: 424-365-0050</a>
      </div>
    </div>
  </div>
</div>

<script>
  const state = { photos: [], idx: 0, touchX: 0 };

  async function loadItems() {
    const statusEl = document.getElementById('status');

    let manifest = {};
    try {
      manifest = await fetch(`photos/manifest.json?v=${Date.now()}`).then(r => r.json());
    } catch {
      statusEl.textContent = 'Could not load photo list. Please try again later.';
      return;
    }

    let rows;
    try {
      const buf = await fetch(`items/items.xlsx?v=${Date.now()}`).then(r => r.arrayBuffer());
      const wb  = XLSX.read(buf, { type: 'array' });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    } catch {
      statusEl.textContent = 'Could not load items. Please try again later.';
      return;
    }

    const grid = document.getElementById('grid');
    let count = 0;

    for (const row of rows) {
      const photos = manifest[String(row.Label)];
      if (!photos || photos.length === 0) continue;
      if (row.Sold !== 0) continue;

      count++;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img class="card-thumb" src="${photos[0]}" alt="${row.Item}" loading="lazy">
        <div class="card-info">
          <div class="card-name">${row.Item}</div>
          <div class="card-price">$${row.Price}</div>
          ${photos.length > 1 ? `<span class="multi-badge">${photos.length} photos</span>` : ''}
        </div>
      `;
      card.addEventListener('click', () => openModal(row, photos));
      grid.appendChild(card);
    }

    statusEl.style.display = 'none';
    if (count === 0) {
      statusEl.style.display = 'block';
      statusEl.textContent   = 'No items available right now — check back soon!';
    }
  }

  function openModal(item, photos) {
    state.photos = photos;
    state.idx    = 0;
    document.getElementById('modal-name').textContent  = item.Item;
    document.getElementById('modal-price').textContent = `$${item.Price}`;
    document.getElementById('modal-detail').textContent = item.Detail || '';
    renderPhoto();
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function renderPhoto() {
    const { photos, idx } = state;
    document.getElementById('modal-img').src = photos[idx];
    const multi = photos.length > 1;
    document.getElementById('arrow-left').style.display  = multi ? 'flex' : 'none';
    document.getElementById('arrow-right').style.display = multi ? 'flex' : 'none';
    const counter = document.getElementById('counter');
    counter.style.display = multi ? 'block' : 'none';
    if (multi) counter.textContent = `${idx + 1} / ${photos.length}`;
  }

  function navigate(dir) {
    state.idx = (state.idx + dir + state.photos.length) % state.photos.length;
    renderPhoto();
  }

  /* ── Events ── */

  // Click outside modal to close
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
  });

  // Keyboard: arrows + ESC
  document.addEventListener('keydown', e => {
    if (!document.getElementById('overlay').classList.contains('open')) return;
    if (e.key === 'Escape')     closeModal();
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  // Touch swipe on image
  const imgSection = document.getElementById('img-section');
  imgSection.addEventListener('touchstart', e => {
    state.touchX = e.touches[0].clientX;
  }, { passive: true });
  imgSection.addEventListener('touchend', e => {
    const diff = state.touchX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) navigate(diff > 0 ? 1 : -1);
  });

  loadItems();
</script>
</body>
</html>
